name: Face-preserved matching color and black-white proof
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/render_face_matching_pair.py'
      - '.github/workflows/render-face-matching-pair.yml'
jobs:
  pair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python experiments/render_face_matching_pair.py
      - uses: actions/upload-artifact@v4
        with:
          name: matching-face-preserved-art-and-numbers-incomplete
          path: review_face_original/
          retention-days: 14
      - name: Save paired evidence without changing main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review_face_original/
          git commit -m 'Paired color and black-white proof; disclose unnumbered microregions' || exit 0
          git pull --rebase origin art-minimal-merges-v4
          git push origin HEAD:art-minimal-merges-v4
