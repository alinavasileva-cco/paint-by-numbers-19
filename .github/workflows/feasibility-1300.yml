name: Verify immutable foreground vs 1300 numbered areas
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/feasibility_1300.py'
      - '.github/workflows/feasibility-1300.yml'
jobs:
  feasibility:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python experiments/feasibility_1300.py
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-foreground-audit
          path: study_1300/
          retention-days: 14
      - name: Publish diagnostics to isolated study branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study_1300/
          git commit -m 'Publish immutable-foreground feasibility evidence' || exit 0
          git pull --rebase origin art-1300-protected-study
          git push origin HEAD:art-1300-protected-study
