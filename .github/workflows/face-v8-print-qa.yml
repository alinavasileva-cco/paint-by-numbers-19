name: V8 print-level face and numbering QA
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/repair_print_labels_face_v8.py
      - .github/workflows/face-v8-print-qa.yml
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python experiments/repair_print_labels_face_v8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-v8-print-proof
          path: |
            face_v8/print_final_qa.json
            face_v8/lineart_final_review.svg
            face_v8/lineart_final_preview.png
            face_v8/lineart_final_screen.png
      - name: Save independent glyph/outline verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add face_v8/print_final_qa.json face_v8/lineart_final* || exit 0
          git commit -m 'Check 951 printed number glyphs against local facial ink' || exit 0
          git pull --rebase origin art-v8-face-natural
          git push origin HEAD:art-v8-face-natural
