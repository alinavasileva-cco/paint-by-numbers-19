name: Test 1300 areas from preserved 1501 study
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/build_1300_preserve.py'
      - '.github/workflows/test-1300.yml'
concurrency:
  group: protected-art-1300
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Use confirmed 1501-cell baseline and attempt 1300 fully-numbered cells
        run: |
          mkdir -p outputs
          cp review/color_segmentation_review.png outputs/color_segmentation_review.png
          python experiments/build_1300_preserve.py --source 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Upload diagnostic or validated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-1300-diagnostic
          path: outputs/
          retention-days: 14
      - name: Publish only a fully passing separate candidate
        if: success()
        run: |
          mkdir -p review_candidate_1300
          cp outputs/lineart_review.svg outputs/lineart_preview.png review_candidate_1300/
          cp outputs/color_segmentation_review.png outputs/color_artist_preview.png review_candidate_1300/
          cp outputs/region_ids_16bit.png outputs/region_color_numbers.csv review_candidate_1300/
          cp outputs/palette.csv outputs/audit.json review_candidate_1300/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review_candidate_1300
          if ! git diff --cached --quiet; then
            git commit -m 'Publish protected 1300-region candidate for artistic review'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
