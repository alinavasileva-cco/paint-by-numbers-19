name: Art-directed numbered painting candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/build_artistic.py'
      - '.github/workflows/artistic.yml'
concurrency:
  group: artistic-review-candidate
  cancel-in-progress: true
jobs:
  art:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Build fully numbered artistic version from approved 1501-cell review
        run: python experiments/build_artistic.py --out outputs_art
      - name: Upload art for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-numbered-review
          path: outputs_art/
          retention-days: 14
      - name: Publish only technically passing version on study branch
        if: success()
        run: |
          mkdir -p review_artistic
          cp outputs_art/* review_artistic/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review_artistic
          if ! git diff --cached --quiet; then
            git commit -m 'Publish numbered artistic candidate for visual review'
            git pull --rebase origin art-1300-protected-study
            git push origin HEAD:art-1300-protected-study
          fi
