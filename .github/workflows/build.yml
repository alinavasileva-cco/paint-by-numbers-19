name: Build paint-by-numbers review
on:
  workflow_dispatch:
  push:
    paths:
      - 'THE_CASE_*.png'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
concurrency:
  group: paint-review-main
  cancel-in-progress: true
jobs:
  build-outline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Trace original image and check labels
        run: |
          python scripts/build.py --input 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Artistically redraw to exactly 1000 fully numbered regions
        run: |
          python scripts/build_1000.py --source 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Build side-by-side detail review sheets
        run: |
          python scripts/review_details.py --input 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Publish review files to repository
        run: |
          mkdir -p review
          cp outputs/lineart_review.svg outputs/lineart_preview.png review/
          cp outputs/color_segmentation_review.png outputs/color_artist_preview.png outputs/palette.csv review/
          cp outputs/audit.json outputs/region_ids_16bit.png review/
          cp outputs/region_color_numbers.csv review/
          cp outputs/comparison_*.png review/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/
          if ! git diff --cached --quiet; then
            git commit -m "Update 19-color horizon review and pixel audit"
            git push origin HEAD:main
          fi
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: detailed-numbered-outline-review
          path: outputs/
          retention-days: 30
