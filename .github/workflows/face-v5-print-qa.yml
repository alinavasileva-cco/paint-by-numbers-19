name: QA print labels after hand-drawn face revision
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/repair_print_labels_face_v5.py'
      - '.github/workflows/face-v5-print-qa.yml'
jobs:
  print_qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Move only problematic digits within their own colored zone
        run: python experiments/repair_print_labels_face_v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-face-print-qa
          path: |
            face_v5/print_final_qa.json
            face_v5/lineart_final_review.svg
            face_v5/lineart_final_preview.png
            face_v5/lineart_final_screen.png
      - name: Publish QA proof separately; do not overwrite main
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add face_v5/print_final_qa.json face_v5/lineart_final* || exit 0
          git commit -m 'Review print-scale ink/number conflicts in V5 face' || exit 0
          git pull --rebase origin art-face-redraw-numbered-v5
          git push origin HEAD:art-face-redraw-numbered-v5
