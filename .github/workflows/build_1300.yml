name: Build 1300-region artistic candidate
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_1300.py
      - .github/workflows/build_1300.yml
concurrency:
  group: artistic-1300-review
  cancel-in-progress: true
jobs:
  build-outline-1300:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare the protected original 1501-region segmentation
        run: python scripts/build.py --input 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Make exactly 1300 labeled regions
        run: |
          python -m py_compile scripts/build_1300.py
          python scripts/build_1300.py --source 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Create comparison crops
        run: python scripts/review_details.py --input 'THE_CASE_ночные_фонари_19_красок.png' --out outputs
      - name: Publish alternative without altering the accepted prior review
        run: |
          mkdir -p review_1300
          cp outputs/lineart_review.svg outputs/lineart_preview.png review_1300/
          cp outputs/color_segmentation_review.png outputs/color_artist_preview.png outputs/palette.csv review_1300/
          cp outputs/audit.json outputs/region_ids_16bit.png review_1300/
          cp outputs/region_color_numbers.csv review_1300/
          cp outputs/comparison_*.png review_1300/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review_1300/
          if ! git diff --cached --quiet; then
            git commit -m "Publish separate 1300-region fit-aware artistic candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload previews and audit
        uses: actions/upload-artifact@v4
        with:
          name: artistic-1300-region-candidate
          path: outputs/
          retention-days: 30
