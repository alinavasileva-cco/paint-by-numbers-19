name: Hand-directed face redraw with fully numbered pigments
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/draw_face_art_v5.py'
      - '.github/workflows/draw-face-art-v5.yml'
concurrency:
  group: hand-redrawn-face-v5
  cancel-in-progress: true
jobs:
  face:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Draw nose, lips, two colored eyes and rebuild numbered paint regions
        run: python experiments/draw_face_art_v5.py --out face_v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-redrawn-numbered-v5
          path: face_v5/
          retention-days: 14
      - name: Publish experiment, never overwrite approved main artwork
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add face_v5
          git commit -m 'Add user-requested hand-directed face and numbering proof' || exit 0
          git pull --rebase origin art-face-redraw-numbered-v5
          git push origin HEAD:art-face-redraw-numbered-v5
