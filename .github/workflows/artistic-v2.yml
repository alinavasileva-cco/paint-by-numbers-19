name: Minimal artistic mergers from 1501 reference
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/build_artistic_v2.py'
      - '.github/workflows/artistic-v2.yml'
concurrency:
  group: art-minimal-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Rebuild from unchanged accepted 1501-area version
        run: python experiments/build_artistic_v2.py --out result_v2
      - name: Upload diagnostics and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-minimal-merges-v2
          path: result_v2/
          retention-days: 14
      - name: Publish only to isolated study branch after numeric check
        if: success()
        run: |
          mkdir -p review_art_v2
          cp result_v2/* review_art_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review_art_v2
          git commit -m 'Publish V2 artistically preserved fully numbered candidate' || exit 0
          git pull --rebase origin art-minimal-merges-v2
          git push origin HEAD:art-minimal-merges-v2
